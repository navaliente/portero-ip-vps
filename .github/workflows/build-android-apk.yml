name: Compilar APK Android (App Portero IP)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app-movil/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Flutter (Android Release)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar estructura nativa Android e inyectar permisos de Videoportero
        working-directory: app-movil
        run: |
          flutter create . --project-name portero_ip_app --org com.navaliente.porteroip --platforms android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <application android:usesCleartextTraffic="true"/' "$MANIFEST"
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
          fi
          flutter pub get

      - name: Compilar APK Release
        working-directory: app-movil
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/portero-ip-edificio.apk

      - name: Publicar APK como Artefacto Descargable en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Portero-IP-Edificio-APK
          path: app-movil/build/app/outputs/flutter-apk/portero-ip-edificio.apk
          retention-days: 90

      - name: Publicar APK en Releases para descarga directa con 1 clic
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "App Móvil Videoportero IP (Android APK)"
          body: "Descarga directa del instalador Android (`portero-ip-edificio.apk`) para los vecinos del edificio."
          files: app-movil/build/app/outputs/flutter-apk/portero-ip-edificio.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

