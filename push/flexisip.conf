# =============================================================================
# CONFIGURACIÓN DE FLEXISIP (PROXY SIP + GATEWAY PUSH PARA APP LINPHONE)
# Ubicación en el VPS: /etc/flexisip/flexisip.conf
# Arquitectura:
#   [Celulares con Linphone] <--(SIP 5062/TLS 5063 + Push FCM/APNs)--> [Flexisip] <--(SIP 5060)--> [Asterisk PBX]
# =============================================================================

[global]
debug=false
syslog-facility=DAEMON
# IP pública del VPS o dominio
aliases=TU_IP_PUBLICA_VPS
# Puertos donde se conectan los celulares con la app Linphone
transports=sip:0.0.0.0:5062;sips:0.0.0.0:5063
tls-certificates-dir=/etc/asterisk/keys

[module::DoSProtection]
enabled=true

[module::Authentication]
# Delegamos la autenticación al servidor Asterisk local (puerto 5060)
enabled=false

[module::Registrar]
enabled=true
reg-domains=TU_IP_PUBLICA_VPS
db-implementation=internal

[module::PushNotification]
enabled=true
# Tiempo (en segundos) que Flexisip espera a que el celular despierte por Push y se registre
# antes de entregarle el INVITE de la llamada del portero KD9203
wake-up-timeout=35
apple=true
google=true
# Ruta al archivo JSON de cuenta de servicio de Firebase (FCM HTTP v1) y certificados APNs
firebase-service-account-dir=/etc/flexisip/push/

[module::Router]
enabled=true
# Reenvía registros y llamadas hacia Asterisk en el mismo VPS (127.0.0.1:5060)
fork-late=true
deliver-to-registered=true
static-route=sip:127.0.0.1:5060

[module::MediaRelay]
enabled=false

