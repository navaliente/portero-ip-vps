; =============================================================================
; PLAN DE MARCADO (DIALPLAN) PARA VIDEOPORTERO IP (KD9203)
; Ubicación en el VPS: /etc/asterisk/extensions.conf
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; Tiempo máximo de timbrado en segundos (40s da margen al Push Notification)
RING_TIMEOUT=40

; =============================================================================
; CONTEXTO PRINCIPAL DEL EDIFICIO
; =============================================================================
[edificio-portero]

; -----------------------------------------------------------------------------
; 1. Llamada desde el Frente KD9203 (o entre vecinos) a un Departamento (101-999)
; Usa PJSIP_DIAL_CONTACTS para que suenen TODOS los celulares y monitores registrados
; en ese departamento al mismo tiempo.
; -----------------------------------------------------------------------------
exten => _[1-7]XX,1,NoOp(=== Llamada hacia Departamento ${EXTEN} desde ${CALLERID(num)} ===)
 same => n,Set(TARGETS=${PJSIP_DIAL_CONTACTS(${EXTEN})})
 same => n,Set(WEBRTC_TARGETS=${PJSIP_DIAL_CONTACTS(${EXTEN}-webrtc)})
 same => n,NoOp(Contactos SIP: ${TARGETS} | WebRTC: ${WEBRTC_TARGETS})
 same => n,GotoIf($[ "${TARGETS}" = "" & "${WEBRTC_TARGETS}" = "" ]?no_contacts)
 same => n,GotoIf($[ "${TARGETS}" != "" & "${WEBRTC_TARGETS}" != "" ]?dial_both)
 same => n,GotoIf($[ "${TARGETS}" != "" ]?dial_sip:dial_webrtc)

 same => n(dial_both),NoOp(Timbrando SIP y WebRTC en simultaneo: ${TARGETS}&${WEBRTC_TARGETS})
 same => n,Dial(${TARGETS}&${WEBRTC_TARGETS},${RING_TIMEOUT},tTkK)
 same => n,Hangup()

 same => n(dial_sip),NoOp(Timbrando cliente SIP (Linphone/Monitor): ${TARGETS})
 same => n,Dial(${TARGETS},${RING_TIMEOUT},tTkK)
 same => n,Hangup()

 same => n(dial_webrtc),NoOp(Timbrando cliente WebRTC: ${WEBRTC_TARGETS})
 same => n,Dial(${WEBRTC_TARGETS},${RING_TIMEOUT},tTkK)
 same => n,Hangup()

 same => n(no_contacts),NoOp(No hay ningun dispositivo registrado para ${EXTEN})
 same => n,Playtones(congestion)
 same => n,Congestion(5)
 same => n,Hangup()

; -----------------------------------------------------------------------------
; 2. Llamada de un vecino hacia el Frente de Calle (8000) para ver cámara / abrir
; -----------------------------------------------------------------------------
exten => 8000,1,NoOp(=== Monitoreo de camara del Portero KD9203 desde ${CALLERID(num)} ===)
 same => n,Set(PORTERO_TARGET=${PJSIP_DIAL_CONTACTS(8000)})
 same => n,GotoIf($[ "${PORTERO_TARGET}" = "" ]?no_portero)
 same => n,Dial(${PORTERO_TARGET},30,tTkK)
 same => n,Hangup()
 same => n(no_portero),Dial(PJSIP/8000,30,tTkK)
 same => n,Hangup()

; -----------------------------------------------------------------------------
; 3. Extensión de prueba de Eco con Video (9999)
; Útil para que cada vecino pruebe su audio, video H.264 y micrófono desde la App
; -----------------------------------------------------------------------------
exten => 9999,1,NoOp(=== Test de Eco de Audio y Video para ${CALLERID(num)} ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

