; =============================================================================
; SERVIDOR HTTP/WEBSOCKET INTERNO DE ASTERISK (PARA APP MÓVIL WEBRTC / SIP.JS)
; Ubicación en el VPS: /etc/asterisk/http.conf
; =============================================================================

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8080
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/asterisk.pem
tlsprivatekey=/etc/asterisk/keys/asterisk.key

