name: portero_ip_app
description: Aplicacion movil de Videoportero IP (KD9203 + Asterisk VPS) con Push CallKit y apertura DTMF (#).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sip_ua: ^1.0.1
  flutter_webrtc: ^1.2.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_callkit_incoming: ^2.0.4+2
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.3.2
  http: ^1.2.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

