; =============================================================================
; PLAN DE MARCADO (DIALPLAN) PARA VIDEOPORTERO IP (KD9203)
; Ubicación en el VPS: /etc/asterisk/extensions.conf
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; Tiempo máximo de timbrado en segundos (40s da margen al Push Notification)
RING_TIMEOUT=40

; =============================================================================
; CONTEXTO PRINCIPAL DEL EDIFICIO
; =============================================================================
[edificio-portero]

; -----------------------------------------------------------------------------
; 1. Llamada desde el Frente KD9203 (o entre vecinos) a un Departamento (101-999)
; Usa PJSIP_DIAL_CONTACTS para que suenen TODOS los celulares registrados
; en ese departamento al mismo tiempo.
; -----------------------------------------------------------------------------
exten => _[1-7]XX,1,NoOp(=== Llamada hacia Departamento ${EXTEN} desde ${CALLERID(num)} ===)
 ; Dispara el script de Push propio (FCM HTTP v1 / Webhook) para despertar celulares bloqueados
 same => n,System(/usr/bin/python3 /var/lib/asterisk/agi-bin/push_wakeup.py ${EXTEN} ${CALLERID(num)} &)
 same => n,Set(SIP_CONTACTS=${PJSIP_DIAL_CONTACTS(${EXTEN})})
 same => n,Set(WEBRTC_CONTACTS=${PJSIP_DIAL_CONTACTS(${EXTEN}-webrtc)})
 same => n,Set(DIAL_TARGETS=${ IF($["${SIP_CONTACTS}" != "" & "${WEBRTC_CONTACTS}" != ""]?${SIP_CONTACTS}&${WEBRTC_CONTACTS}:${SIP_CONTACTS}${WEBRTC_CONTACTS}) })
 ; Si los celulares están dormidos, esperamos 2 segundos tras enviar el Push o enrutamos por Flexisip
 same => n,GotoIf($["${DIAL_TARGETS}" = ""]?wake_flexisip:dial_all)

 same => n(wake_flexisip),NoOp(Celulares dormidos en ${EXTEN}: dando 2s al Push y llamando via Flexisip + WebRTC...)
 same => n,Wait(2)
 same => n,Set(WEBRTC_AFTER_WAIT=${PJSIP_DIAL_CONTACTS(${EXTEN}-webrtc)})
 same => n,GotoIf($["${WEBRTC_AFTER_WAIT}" != ""]?dial_woken_webrtc)
 same => n,Dial(PJSIP/${EXTEN}/sip:${EXTEN}@127.0.0.1:5062,${RING_TIMEOUT},tTkK)
 same => n,Hangup()

 same => n(dial_woken_webrtc),Dial(${WEBRTC_AFTER_WAIT},${RING_TIMEOUT},tTkK)
 same => n,Hangup()

 same => n(dial_all),NoOp(Timbrando dispositivos activos SIP + WebRTC: ${DIAL_TARGETS})
 same => n,Dial(${DIAL_TARGETS},${RING_TIMEOUT},tTkK)
 same => n,NoOp(Estado de la llamada: ${DIALSTATUS})
 same => n,Hangup()

; -----------------------------------------------------------------------------
; 2. Llamada de un vecino hacia el Frente de Calle (8000) para ver cámara / abrir
; -----------------------------------------------------------------------------
exten => 8000,1,NoOp(=== Monitoreo de cámara del Portero KD9203 desde ${CALLERID(num)} ===)
 same => n,Dial(PJSIP/8000,30,tTkK)
 same => n,Hangup()

; -----------------------------------------------------------------------------
; 3. Extensión de prueba de Eco con Video (9999)
; Útil para que cada vecino pruebe su audio, video H.264 y micrófono desde la App
; -----------------------------------------------------------------------------
exten => 9999,1,NoOp(=== Test de Eco de Audio y Video para ${CALLERID(num)} ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

