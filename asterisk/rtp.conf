; =============================================================================
; CONFIGURACIÓN RTP (AUDIO + VIDEO H.264 + ICE/STUN)
; Ubicación en el VPS: /etc/asterisk/rtp.conf
; =============================================================================

[general]
rtpstart=10000
rtpend=20000
rtpchecksums=no
dtmftimeout=3000
rtcpinterval=5000
icesupport=yes
stunaddr=stun.l.google.com:19302

