; =============================================================================
; CONFIGURACIÓN PJSIP PARA VIDEOPORTERO IP (KD9203 + VECINOS)
; Ubicación en el VPS: /etc/asterisk/pjsip.conf
; =============================================================================

; -----------------------------------------------------------------------------
; 1. TRANSPORTES DE RED (UDP, TCP, TLS, WSS)
; Reemplazar TU_IP_PUBLICA_VPS por la IPv4 pública fija del VPS
; -----------------------------------------------------------------------------

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=TU_IP_PUBLICA_VPS
external_signaling_address=TU_IP_PUBLICA_VPS
local_net=127.0.0.1/32
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=TU_IP_PUBLICA_VPS
external_signaling_address=TU_IP_PUBLICA_VPS
local_net=127.0.0.1/32
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2
external_media_address=TU_IP_PUBLICA_VPS
external_signaling_address=TU_IP_PUBLICA_VPS
local_net=127.0.0.1/32

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

; -----------------------------------------------------------------------------
; 2. PLANTILLAS BASE (NAT + VIDEO H.264 + DTMF)
; -----------------------------------------------------------------------------

[endpoint-base](!)
type=endpoint
context=edificio-portero
disallow=all
allow=ulaw
allow=alaw
allow=opus
allow=h264
dtmf_mode=rfc4733
; Configuración crítica para atravesar NAT (Router del edificio y 4G/5G de celulares)
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
ice_support=no
timers=yes

; Plantilla específica para la App Móvil propia (Flutter WebRTC sobre WS/WSS)
[endpoint-webrtc](!,endpoint-base)
webrtc=yes
ice_support=yes
dtls_auto_generate_cert=yes
media_encryption=dtls
use_avpf=yes
rtcp_mux=yes

[auth-base](!)
type=auth
auth_type=userpass

[aor-vecino](!)
type=aor
; Permite hasta 5 celulares registrados simultáneamente por departamento
max_contacts=5
remove_existing=yes
qualify_frequency=60
; Si instalas Flexisip en puerto 5062, descomenta la siguiente línea:
;outbound_proxy=sip:127.0.0.1:5062\;lr

[aor-vecino-webrtc](!)
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=60

[aor-portero](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; -----------------------------------------------------------------------------
; 3. EXTENSIÓN 8000: FRENTE DE CALLE KD9203
; -----------------------------------------------------------------------------

[8000](endpoint-base)
auth=8000-auth
aors=8000
callerid="Portero Edificio" <8000>
; Si el KD9203 envía DTMF por SIP INFO además de RFC2833/4733, cambiar a auto
dtmf_mode=auto

[8000-auth](auth-base)
username=8000
password=CAMBIAR_CLAVE_PORTERO_8000

[8000](aor-portero)

; -----------------------------------------------------------------------------
; 4. EXTENSIONES DE VECINOS (Departamentos)
; -----------------------------------------------------------------------------

; --- Departamento 101 (SIP Estándar + App Propia WebRTC) ---
[101](endpoint-base)
auth=101-auth
aors=101
callerid="Depto 101" <101>

[101-webrtc](endpoint-webrtc)
auth=101-auth
aors=101-webrtc
callerid="Depto 101 App" <101>

[101-auth](auth-base)
username=101
password=CAMBIAR_CLAVE_DEPTO_101

[101](aor-vecino)
[101-webrtc](aor-vecino-webrtc)

; --- Departamento 102 (SIP Estándar + App Propia WebRTC) ---
[102](endpoint-base)
auth=102-auth
aors=102
callerid="Depto 102" <102>

[102-webrtc](endpoint-webrtc)
auth=102-auth
aors=102-webrtc
callerid="Depto 102 App" <102>

[102-auth](auth-base)
username=102
password=CAMBIAR_CLAVE_DEPTO_102

[102](aor-vecino)
[102-webrtc](aor-vecino-webrtc)

; --- Departamento 201 (SIP Estándar + App Propia WebRTC) ---
[201](endpoint-base)
auth=201-auth
aors=201
callerid="Depto 201" <201>

[201-webrtc](endpoint-webrtc)
auth=201-auth
aors=201-webrtc
callerid="Depto 201 App" <201>

[201-auth](auth-base)
username=201
password=CAMBIAR_CLAVE_DEPTO_201

[201](aor-vecino)
[201-webrtc](aor-vecino-webrtc)

; Incluir archivo adicional para vecinos creados con el script agregar_vecino.sh
#tryinclude "pjsip_vecinos_extra.conf"

